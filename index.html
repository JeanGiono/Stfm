<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>綜合專業測考題庫整合系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef6ff', 100: '#d9ebff', 500: '#1d63ed', 600: '#0047ca', 700: '#0037a5', 800: '#00287a'
            }
          }
        }
      }
    }
  </script>
  <style>
    .opt-btn { transition: all 0.15s ease-in-out; }
    .opt-btn:hover:not(:disabled) { border-color: #3b82f6; background-color: #eff6ff; }
    .dark .opt-btn:hover:not(:disabled) { border-color: #60a5fa; background-color: #1e293b; }
    .opt-selected-correct { background-color: #def7ec !important; border-color: #0e9f6e !important; color: #03543f !important; font-weight: 700; }
    .opt-selected-wrong { background-color: #fde8e8 !important; border-color: #f05252 !important; color: #9b1c1c !important; font-weight: 700; }
    .dark .opt-selected-correct { background-color: #064e3b !important; border-color: #059669 !important; color: #a7f3d0 !important; }
    .dark .opt-selected-wrong { background-color: #7f1d1d !important; border-color: #dc2626 !important; color: #fecaca !important; }
    .mask-answer { background-color: #f1f5f9; color: #94a3b8; border-radius: 4px; padding: 2px 6px; user-select: none; cursor: pointer; transition: all 0.2s; }
    .dark .mask-answer { background-color: #334155; color: #64748b; }
    .mask-revealed { background-color: #dbeafe !important; color: #1e40af !important; font-weight: 600; }
    .dark .mask-revealed { background-color: #1e3a8a !important; color: #93c5fd !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-800/95 backdrop-blur border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-3">
        
        <!-- Logo & Bank Title -->
        <div class="flex items-center gap-3 min-w-0">
          <div id="bankBadgeIcon" class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-black text-lg shadow-md flex-shrink-0">
            修
          </div>
          <div class="truncate">
            <h1 class="text-base sm:text-lg font-bold leading-tight flex items-center gap-2 truncate">
              <span id="currentBankTitleText">修護標準化測考題庫</span>
              <span id="bankCountBadge" class="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300 font-semibold hidden sm:inline-block">500題</span>
            </h1>
            <p id="bankSubtitleText" class="text-xs text-slate-500 dark:text-slate-400 truncate">修護管理作業手冊與標準化測考練習系統</p>
          </div>
        </div>

        <!-- Bank Switcher Dropdown & Tool Actions -->
        <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
          <!-- Main Switcher -->
          <div class="flex items-center gap-1.5">
            <label for="bankSelector" class="hidden md:inline text-xs font-bold text-slate-500 dark:text-slate-400">切換題庫：</label>
            <select id="bankSelector" onchange="switchBank(this.value)" class="text-xs sm:text-sm font-semibold bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-2.5 py-1.5 text-brand-600 dark:text-brand-300 focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="maintenance">🛠️ 修護標準化 (500題選擇)</option>
              <option value="english">🌐 英文原題模擬考 (150題選擇)</option>
              <option value="safety">🛡️ 地面安全題庫 (60填空+6問答+5實境)</option>
            </select>
          </div>

          <!-- Theme Toggle -->
          <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="切換深淺模式">
            <svg id="sunIcon" class="w-5 h-5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg id="moonIcon" class="w-5 h-5 block dark:hidden text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN BODY WRAPPER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8 space-y-6">

    <!-- ========================================== -->
    <!-- VIEW A: MULTIPLE CHOICE QUIZ (修護 500 / 英文 150) -->
    <!-- ========================================== -->
    <div id="view-mcq" class="space-y-5">
      <!-- Control Toolbar Card -->
      <div class="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2.5">
            <label class="text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300">模式：</label>
            <select id="mcqModeSelect" onchange="handleMcqModeChange()" class="text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="practice">循序研讀練習 (全部循序)</option>
              <option value="exam-20">隨機模擬考 (20 題)</option>
              <option value="exam-50">隨機模擬考 (50 題)</option>
              <option value="exam-100">隨機模擬考 (100 題)</option>
              <option value="exam-all">全庫模擬測驗</option>
            </select>

            <button onclick="startNewMcqQuiz()" class="text-xs sm:text-sm bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-1.5 rounded-xl shadow-sm transition">
              重新載入
            </button>
          </div>

          <!-- Quick Function Buttons -->
          <div class="flex flex-wrap items-center gap-2">
            <button id="mcqSubmitExamBtn" onclick="submitExam()" class="hidden text-xs sm:text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-1.5 rounded-xl shadow-sm transition">
              完成交卷
            </button>
            <button onclick="toggleMcqAnswers()" class="text-xs sm:text-sm bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-600 font-medium transition">
              顯示/隱藏正解
            </button>
            <button id="mcqFilterWrongBtn" onclick="toggleFilterWrong()" class="text-xs sm:text-sm bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-600 font-medium transition">
              只看錯題
            </button>
            <button onclick="resetMcqProgress()" class="text-xs sm:text-sm text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-700 px-3 py-1.5 rounded-xl border border-rose-200 dark:border-rose-900/50 transition">
              清空重測
            </button>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="relative">
          <input type="text" id="mcqSearchInput" onkeyup="handleMcqSearch()" placeholder="輸入關鍵字或題號進行快速搜尋..." class="w-full pl-10 pr-4 py-2 text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
          <svg class="w-4 h-4 absolute left-3.5 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <!-- Dashboard Stat Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-3 border-t border-slate-100 dark:border-slate-700/60 text-center text-xs sm:text-sm">
          <div class="bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="text-slate-400 block text-[11px]">總題數</span>
            <span id="mcqStatTotal" class="text-base sm:text-lg font-bold">0</span>
          </div>
          <div class="bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="text-slate-400 block text-[11px]">已作答</span>
            <span id="mcqStatAnswered" class="text-base sm:text-lg font-bold text-blue-600 dark:text-blue-400">0</span>
          </div>
          <div class="bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="text-slate-400 block text-[11px]">答對</span>
            <span id="mcqStatCorrect" class="text-base sm:text-lg font-bold text-emerald-600 dark:text-emerald-400">0</span>
          </div>
          <div class="bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="text-slate-400 block text-[11px]">答錯</span>
            <span id="mcqStatWrong" class="text-base sm:text-lg font-bold text-rose-600 dark:text-rose-400">0</span>
          </div>
          <div class="col-span-2 sm:col-span-1 bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="text-slate-400 block text-[11px]">答對率</span>
            <span id="mcqStatAccuracy" class="text-base sm:text-lg font-bold text-indigo-600 dark:text-indigo-400">0%</span>
          </div>
        </div>

      </div>

      <!-- Question Cards List Container -->
      <div id="mcqListContainer" class="space-y-4"></div>

      <!-- Pagination Navigation -->
      <div id="mcqPaginationBar" class="flex items-center justify-center gap-3 pt-4">
        <button onclick="mcqPrevPage()" class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          ◀ 上一頁
        </button>
        <span id="mcqPageIndicator" class="text-xs sm:text-sm font-bold text-slate-600 dark:text-slate-300">
          第 1 / 1 頁
        </span>
        <button onclick="mcqNextPage()" class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          下一頁 ▶
        </button>
      </div>
    </div>


    <!-- ========================================== -->
    <!-- VIEW B: GROUND SAFETY SYSTEM (地面安全題庫) -->
    <!-- ========================================== -->
    <div id="view-safety" class="hidden space-y-6">

      <!-- Navigation Tabs for Safety -->
      <div class="bg-white dark:bg-slate-800 p-2 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex gap-2 overflow-x-auto text-xs sm:text-sm font-medium">
        <button onclick="switchSafetyTab('study')" id="safetyTabBtn-study" class="px-3.5 py-2 rounded-xl transition bg-brand-600 text-white font-bold whitespace-nowrap">
          模式一：60題填空循序研讀
        </button>
        <button onclick="switchSafetyTab('quiz')" id="safetyTabBtn-quiz" class="px-3.5 py-2 rounded-xl transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 whitespace-nowrap">
          模式二：隨機測驗模擬
        </button>
        <button onclick="switchSafetyTab('qa')" id="safetyTabBtn-qa" class="px-3.5 py-2 rounded-xl transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 whitespace-nowrap">
          模式三：問答與處置情境 (6+5題)
        </button>
        <button onclick="switchSafetyTab('search')" id="safetyTabBtn-search" class="px-3.5 py-2 rounded-xl transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 whitespace-nowrap">
          模式四：地安專屬全庫搜尋
        </button>
      </div>

      <!-- SAFETY TAB 1: STUDY MODE -->
      <div id="safetyPanel-study" class="space-y-4">
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xs sm:text-sm font-bold">跳轉題號：</span>
            <select id="safetyJumpSelect" onchange="jumpSafetyQuestion(this.value)" class="text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-brand-500 outline-none">
            </select>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleAllSafetyAnswers(true)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-300 hover:bg-brand-100">
              全部顯示答案
            </button>
            <button onclick="toggleAllSafetyAnswers(false)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200">
              全部遮蔽答案 (挖空自我練習)
            </button>
          </div>
        </div>

        <div id="safetyCategoryContainer" class="flex flex-wrap gap-2 text-xs"></div>
        <div id="safetyQuestionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- SAFETY TAB 2: FILL-IN-THE-BLANK QUIZ -->
      <div id="safetyPanel-quiz" class="hidden space-y-6">
        <div id="safetyQuizSetupCard" class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-center max-w-xl mx-auto space-y-4">
          <div class="text-4xl">✍️</div>
          <h2 class="text-xl font-bold">地面安全填空測驗模式</h2>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            隨機抽考地安關鍵重點，遮蔽答案直接線上對答或點擊確認記憶！
          </p>
          <div class="flex justify-center gap-3 pt-2">
            <button onclick="startSafetyQuiz(10)" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs sm:text-sm font-semibold hover:bg-brand-700">抽考 10 題</button>
            <button onclick="startSafetyQuiz(20)" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-semibold hover:bg-indigo-700">抽考 20 題</button>
            <button onclick="startSafetyQuiz(60)" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-semibold hover:bg-slate-900">全題庫 60 題特訓</button>
          </div>
        </div>

        <div id="safetyQuizRunningPanel" class="hidden space-y-4 max-w-3xl mx-auto">
          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs sm:text-sm">
            <span id="safetyQuizProgressText" class="font-bold text-brand-600 dark:text-brand-400">第 1 / 10 題</span>
            <span>已答對：<strong id="safetyQuizScoreText" class="text-emerald-600">0</strong> 題</span>
          </div>
          <div id="safetyQuizQuestionCard" class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4"></div>
        </div>

        <div id="safetyQuizResultPanel" class="hidden bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 text-center max-w-md mx-auto space-y-4">
          <div class="text-5xl">🏆</div>
          <h3 class="text-2xl font-bold">地安測驗結算</h3>
          <p id="safetyQuizScoreSummary" class="text-sm leading-relaxed text-slate-600 dark:text-slate-300"></p>
          <div class="pt-2 flex justify-center gap-3">
            <button onclick="restartSafetyQuiz()" class="px-5 py-2.5 bg-brand-600 text-white rounded-xl font-bold text-xs sm:text-sm">再次測驗</button>
            <button onclick="switchSafetyTab('study')" class="px-5 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl font-bold text-xs sm:text-sm">回題庫背誦</button>
          </div>
        </div>
      </div>

      <!-- SAFETY TAB 3: QA & SITUATIONS -->
      <div id="safetyPanel-qa" class="hidden space-y-8">
        <!-- 6 QA Section -->
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b pb-3 border-slate-200 dark:border-slate-700">
            <div>
              <h2 class="text-lg sm:text-xl font-bold flex items-center gap-2">
                <span class="w-2.5 h-6 bg-amber-500 rounded-full inline-block"></span>
                貳、地安簡答題庫 (共 6 大題)
              </h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">傷亡免報標準、不列呈報情事、營內/外失事通知、逾期隱瞞處分與督導項目</p>
            </div>
            <button onclick="toggleAllSafetyQA()" class="text-xs px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300 font-semibold border border-amber-200">
              展開/收合全部
            </button>
          </div>
          <div id="safetyQAContainer" class="space-y-3"></div>
        </div>

        <!-- 5 Situations Section -->
        <div class="space-y-4 pt-4">
          <div class="flex items-center justify-between border-b pb-3 border-slate-200 dark:border-slate-700">
            <div>
              <h2 class="text-lg sm:text-xl font-bold flex items-center gap-2">
                <span class="w-2.5 h-6 bg-red-500 rounded-full inline-block"></span>
                參、實境狀況處置題 (共 5 題情境演練)
              </h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">查明事證要項、注意事項、通報回報對象與標準回報處置範本</p>
            </div>
            <button onclick="toggleAllSafetySituations()" class="text-xs px-3 py-1.5 rounded-lg bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-300 font-semibold border border-red-200">
              展開/收合全部
            </button>
          </div>
          <div id="safetySituationsContainer" class="grid grid-cols-1 gap-6"></div>
        </div>
      </div>

      <!-- SAFETY TAB 4: SEARCH -->
      <div id="safetyPanel-search" class="hidden space-y-4">
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
          <input type="text" id="safetySearchInput" oninput="executeSafetySearch(this.value)" placeholder="輸入關鍵字（例如：一級事件、滅火器、30分鐘、90分貝、骨折）..." class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-xs sm:text-sm">
          <div id="safetySearchResultsCount" class="text-xs text-slate-500 dark:text-slate-400">請輸入關鍵字進行地安專屬檢索</div>
        </div>
        <div id="safetySearchResultsList" class="space-y-3"></div>
      </div>

    </div>

  </main>

  <!-- RESULT MODAL -->
  <div id="scoreModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 text-center shadow-2xl border border-slate-200 dark:border-slate-700">
      <div class="w-16 h-16 mx-auto mb-4 bg-blue-50 dark:bg-blue-950 text-blue-600 rounded-full flex items-center justify-center text-3xl">
        📊
      </div>
      <h3 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">模擬測驗成績結果</h3>
      <div id="modalScoreText" class="text-4xl sm:text-5xl font-black text-brand-600 my-4">0 分</div>
      <p id="modalDetailText" class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed"></p>
      <div class="flex gap-2">
        <button onclick="closeScoreModal()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl font-bold text-xs sm:text-sm transition">
          檢視答題狀況
        </button>
        <button onclick="toggleFilterWrong(); closeScoreModal();" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition">
          只看錯題

{id:182,q:"依「空軍飛行部隊修護作業手冊」第2章第7節規定，修管科依工作單位退回修護資料蒐集紀錄表(AFTO 349A表)將定更件序號、已使用時間、安裝時間、下次更換時間登錄於飛機附件維護紀錄簿(AFTO 表)並核對LIMS模組，以保持資料",a:"D",options:{A:"781A",B:"781K",C:"4001表",D:"781E"}},
{id:183,q:"依「空軍飛行部隊修護作業手冊」第2章規定，_負責機隊管理作業程序之執行及管制(包含各項週檢、定更及定期檢查項目)，此次輔檢發現單位各項定更及定期檢查項目，均有重要逾期件管理模組(IIT)與修護預警模組(MAL)未建置",a:"A",options:{A:"修管科",B:"品標科",C:"後勤科",D:"補支科"}},
{id:184,q:"依「空軍飛行部隊修護作業手冊」第3章第1節規定，週檢站內檢驗人員實施各階段品質檢驗，及品管單位執行抽檢時所發現之缺點，均應填寫檢驗點紀錄表( )採取改正措施後",a:"C",options:{A:"781A",B:"781K",C:"4001表",D:"95卡"}},
{id:185,q:"依「空軍飛行部隊修護作業手冊」第二章第一節「修護管制」規範，何者正確？",a:"D",options:{A:"機隊管理應結合飛行時數、飛訓任務、機身架構鐘點、週期檢查、階段檢查、更定檢等計畫性修護工作，器材週轉管制及工作負荷等相關需求與參數，妥慎精算支援飛機飛行鐘點及架次。",B:"計畫管制為一切修護計畫制訂之專責單位，應經常與各有關單位保持密切聯繫，蒐集及研擬一切工作優先、人力、工時、技術、器材、工具、裝備設施等有關資料，以作為制訂聯隊飛機、地裝等使用及修護計畫之依據。",C:"飛機情況管制：應運用修護管理系統(BMMS)飛機情況管理模組，接收飛行線飛機及地裝情況之報告，經常掌握飛機、地裝之瞬時情況，與正確之停放位置資料，隨時注意修護及飛行計畫達成之程度。",D:"「每日修補檢討會」，由修管科科長主持(修補大隊大隊長【或代理人】每月至少年1日主持)會議檢討事項、提報人員、方式及重點。"}},
{id:186,q:"依「空軍飛行部隊修護作業手冊」第二章第四節「發工管制及專業派遣」規範，何者為非？",a:"A",options:{A:"每週執行週檢績效分析，檢討未能按在站天數出站原因，並依天氣、器材、人員技術、人力運用、裝備支援等因素，檢討研究改進措施，即週檢績效分析，以增進週檢效率。",B:"飛機情況管制報告，係各部隊每日飛機妥善情況定時(0600時)傳送司令部及保指部，並符飛機異動情況資料、隨時輸入空用後勤資訊系統(陸軍後動指揮部網絡)飛機情況管制模組及BMMS之飛機情況管理模組，以顯示飛機現況。",C:"計畫修護：修護工作，能按預定計畫安排，所需護器材亦能預為籌備者，如各項定期檢查、接地檢查、特別檢查、技術檢查、附件定期更換、時限技令執行及修改等。",D:"非計畫修護：為飛機臨時故障，或意外損傷所需維護工作而不可預期計畫者"}},
{id:187,q:"依「空軍飛行部隊修護作業手冊」第三章第一節「品質查核與管制」規範，何者正確？",a:"D",options:{A:"飛機重複故障管制：飛機之故障經檢修報妥後，於以後5架次飛行期間(含飛行前、中、後檢查；清行及故障代碼相同等)，發現同樣之缺點，即為重複故障。",B:"特別檢查：此種檢查通常由品管單位召集相關專業制訂檢查項目督導執行，修管科管制，但亦可由修補大隊大隊長指定之工作中心或個人執行",C:"效能試飛工作，應依據技令1-1-300及該試飛機種之-6技令或其他有關指令、本軍頒發之該型飛機效能試飛標準作業程序等實施，惟需飛機之適航性可依據技令執行修護操作檢查決定時，即不需故障代碼情況",D:"以上皆是"}},
{id:188,q:"依「空軍飛行部隊修護作業手冊」第三章第一節「品質查核與管制」規範，何者為非？",a:"C",options:{A:"飛機重複故障：機務分隊發工同時，應運用操作資料蒐集模組之任務歸詢功能，執行故障情況登錄，同時在781A表上加蓋飛機重複故障次數鑑定章。",B:"如確屬重複故障，立即在781A表上之重複故障次數鑑定印章上加蓋品質管制章，以提醒檢修單位注意，據以實施故障改正後之查證工作",C:"經專業單位下載相關記憶體資料後，發現故障情況與前次不同得經由品管人員驗證後，確屬非重複故障，於781A表改正欄加蓋「飛機重複故障註銷章」，由修管",D:"屬第3次(含)以上之重複故障者，由品質標準科陳召集有關專長人員及邀請機務室人員或故障發現者到席，由大隊長主持研討會議。"}},
{id:189,q:"依「空軍飛行部隊修護作業手冊」規定，品標科須針對各停機線執行督導及稽核作業。",a:"B",options:{A:"勞安",B:"品質",C:"衛生",D:"情緒"}},
{id:190,q:"依「空軍修護管理作業手冊」第2章第7節規定，完成時限技令時，由時限技令執行工作單位，登錄於_表格(或其他等同經歷表)，並詳實登載完工紀錄(含發(完)工日期、工期、(或委託單統號等)、TCTO/SB號碼、執行結果及人員簽證等資料",a:"B",options:{A:"781A表",B:"AFTO 95表",C:"781K表",D:"244表"}},
{id:191,q:"依「空軍修護管理作業手冊」第5章第5節規定，何者為非？",a:"A",options:{A:"凡屬故障或奉令停(禁)用裝備，可納入CBU件管制。",B:"針對現有裝備整體檢討全軍需求，就任務優先緩急情況，實施重大分配作業，以充份發揮運用功效，有效支援戰訓任務。",C:"單位應視試裝屆期與故障情況，逕行送修校作為。",D:"凡屬故障之器材、P-T件手工具等器材，須於30個工作日內呈報保指部管制，並於3個月內完成補廢申補作業，不得延修。"}},
{id:192,q:"依「空軍修護管理作業手冊」，清冊造報後所_之裝備，應以黑筆增列於清冊最後乙項，並於裝備現況欄以鉛筆註明接收日期、來源、原因…等，列入下次檢查必檢項目。",a:"B",options:{A:"妥善",B:"新增",C:"故障",D:"待修"}},
{id:193,q:"依「空軍修護管理作業手冊」及「職業安全衛生管理辦法」第19條規定，雇主對固定式起重機，應_就該機械之整體定期實施檢查一次。",a:"A",options:{A:"每年",B:"每半年",C:"每月",D:"每季"}},

{id:195,q:"依「空軍修護管理作業手冊」第2章第4節規定，修護工作完畢須針對執行外物預防檢查。",a:"C",options:{A:"危險區域",B:"進氣道",C:"施工區域",D:"排氣口"}},
{id:196,q:"依「空軍修護管理作業手冊」第2章第4節規定「及系統修理工作區域應確實執行每日外物預防工作，確保無外物存",a:"B",options:{A:"危險區域",B:"發動機",C:"施工區域",D:"排氣口"}},
{id:197,q:"依「空軍修護管理作業手冊」第2章第7節，庫儲受影響器材須懇掛技令何項掛籤(50G掛籤)，並由品管單位鑑定簽章。",a:"B",options:{A:"試驗標籤",B:"校正標籤",C:"財產標籤",D:"不須懸掛"}},
{id:198,q:"依「空軍修護管理作業手冊」第2章第7節規定，全數完成後，剩餘器材應辦理繳回基地一般庫，避免器材囤積。",a:"C",options:{A:"快速修訂頁次",B:"單位分檔",C:"時限技令",D:"主檔"}},
{id:199,q:"依「空軍修護管理作業手冊」第2章第7節規定，每月定期召開基地時限技令審查管制會(CCB)，並於次月_日前函送保指部備查。",a:"B",options:{A:"5",B:"10",C:"15",D:"20"}},
{id:200,q:"下列地面失事之定義何者為非?(空軍飛行及地面安全教範)。",a:"D",options:{A:"不論事件發生之地點或時間，凡本軍所屬人員(含聘雇及學生)遭受傷害或死亡",B:"本軍財產遭受毀損者",C:"非本軍人員或財產，因本軍活動而遭致傷害或毀損者",D:"本軍所屬人員因車造成非本軍人員或財產毀損者"}},
{id:201,q:"依「空軍修護管理作業手冊」第2章第7節規定，時限技令，時限技令器材管制官應建立時限技令器材包管制表( )，以便登記並管制時限技令器材申請撥補情況。",a:"D",options:{A:"781A",B:"781K",C:"4001表",D:"6005表"}},
{id:202,q:"依「空軍修護管理作業手冊」第2章第7節規定，時限技令全數完成後，剩餘器材應辦理繳回基地。",a:"B",options:{A:"工檔",B:"一般庫",C:"專業庫",D:"料配件總庫"}},
{id:203,q:"依「空軍修護管理作業手冊」第2章第7節規定，時限技令管制單位接獲保指部審查分類通知單後，於7個工作天內以「_」分送有關單位規劃執行或參考。",a:"A",options:{A:"時限技令通告",B:"主檔",C:"快速修訂頁次",D:"單位分檔"}},
{id:204,q:"依「空軍修護管理作業手冊」第2章第7節規定，時限技令屬持續性執行項目，由受影響單位依時限技令技術文件內容檢討，增(修)訂技術通報後，提送審查辦理結案作業。",a:"A",options:{A:"保指部",B:"國防部",C:"品標科",D:"司令部"}},
{id:205,q:"依「空軍修護管理作業手冊」第2章第7節規定，國內(外)廠商發布時限技令技術文件屬持續性執行且為週期性檢查項目者，由受影響單位參照時限技令技術文件內容執行相關階段檢查卡增(修)訂後，送何處辦理結案審查作業。",a:"C",options:{A:"一指部",B:"國防部",C:"保指部",D:"三指部"}},
{id:206,q:"依「空軍修護管理作業手冊」第3章第1節規定，施工中需執行檢驗之程序及相關之(如：尺碼檢查、NDI、功能測試紀錄等)須填寫於標準檢驗紀錄簿。",a:"C",options:{A:"拆件週轉紀錄",B:"工時紀錄簿",C:"重要數據",D:"FO交接紀錄表"}},
{id:207,q:"依「空軍修護管理作業手冊」第3章第1款規定，凡某項作業對操作人員有危害性或影響健康之虞者，單位除購置人員防護用具外，_應由後勤科對操作人員實施防護裝備訓練乙次，並示範各類防護裝備配戴之正確方法。",a:"A",options:{A:"每季",B:"每年",C:"每年",D:"每月"}},
{id:208,q:"依「空軍修護管理作業手冊」第5章第1節停飛飛機覆飛管制作業規定，各部隊應成立待件機管制小組(站長制)，以方式，落實執行停飛期間維護保養檢查及器材週轉復原工作調派與聯繫，並於每日稀補檢討會提報待件機工作進度及器材獲補與週轉情況，由修護管制單位管制各項異動情況。",a:"C",options:{A:"公差性質",B:"輪流擇派",C:"專人專責",D:"抽籤"}},
{id:209,q:"依「空軍修護管理作業手冊」第5章第2節第7款規定，工作人員執行器材置換工作，待所有復裝、檢試工作完成後，第2聯退回補管科將相關資料填註於第3聯，彙整第2聯及復原AFTO後，送審查予以存檔。",a:"D",options:{A:"781A",B:"781K",C:"4001表",D:"349A"}},
{id:210,q:"依「空軍修護管理作業手冊」第5章第2節第7款規定，拆下器材完成表簽銷後，另登乙欄「待復原」註明申請單、週轉編",a:"A",options:{A:"781A",B:"781K",C:"拆件週轉單",D:"95卡"}},
{id:211,q:"依「空軍修護管理作業手冊」第5章第2節規定，完成機機器材週轉作業後應於AFTO 781A 表簽銷後，再將相關資料轉載於「附件週轉紀錄表」CAFM 991A表第1聯內，並另簽乙欄註明申請單號、週轉編號。",a:"B",options:{A:"待裝機",B:"待復原",C:"拆卸妥",D:"待測試"}},
{id:212,q:"依「空軍修護管理作業手冊」第5章第2節規定，待件機管理情況，完成機機器材週轉作業後應於781A表另簽乙欄「_」註明申請單號、週轉編號；第7款規定，每月針對附件週轉情況予以統計、分析，查明造成週轉原因(如器材欠撥、MSD檔不精確、備料不實或屬消失性商源等)，俾檢討改正。",a:"A",options:{A:"待復原",B:"無器材",C:"已納入781K表",D:"消耗中"}},
{id:213,q:"依「空軍修護管理作業手冊」第5章第3節規定，修管科發動機資料管理人員依_系統資料，審查管制發動機紀錄文件以確保紀錄正確，每月統計異動錯誤情況，俾供各相關單位檢討",a:"B",options:{A:"RAA",B:"LIMS",C:"LTC",D:"IIT"}},
{id:214,q:"依「空軍修護管理作業手冊」第5章第4節規定，何者為非？",a:"D",options:{A:"飛行聯隊修補大隊應建立扭力、壓力校驗能量，以持恆機隊及轄區內之本軍修護用儀表與工具作業標準。",B:"使用單位應定期檢查裝備接地、避雷設施，高壓警告標示，工具使用等地安項目，防止人員及裝備遭受傷害。",C:"凡使用前校驗件(CBU)試裝技術管控制檢復使用前，應異動為定期校驗件(PMEL)重複送校，以明確功能妥善始",D:"以上皆是"}},
{id:215,q:"依「空軍修護管理作業手冊」第5章第5節規定，何者為非？",a:"A",options:{A:"後勤科係飛行聯隊全般試裝維管權責單位，應負責帳務稽核、內部調挪、送修校資訊審查等管制之",B:"單位自校件應明確裝備帳籍，落實定校作業，以確保試裝精準可用。",C:"單位送校試裝應落實管控檢運與返返節點，俾維護備妥善可用裕度。",D:"單位應明確年度修校計畫期程，配合試裝屆期與轄區游校期程辦理送修校作業。"}},
{id:216,q:"依「空軍修護管理作業手冊」第5章規定，各式掛勾與拖桿頭為落實執行每日目視檢查，不得噴塗任何_，以確認掛勾與拖桿頭無產生裂紋損傷。",a:"C",options:{A:"清潔劑",B:"酒精",C:"漆料",D:"有機溶劑"}},
{id:217,q:"依「空軍修護管理作業手冊」第一章第七節「修護適用法規及文件之運用與考核」規範，何者為非？",a:"B",options:{A:"本軍修護通報係依據修護政策、修護管理作業手冊及相關法規技令制訂，主要在對既有之政策及準則提供詳細之規範或作業規定，並針對性之修護程序提供驗證測試。",B:"各使用單位對修護通報各項作業規定，於使用中發現內容有不合時宜之情況時，應循序反映保修指揮部技管管制編號後，交教準部請技令系統印發。",C:"核定之修護通報先送保修指揮部賦予管制編號後，交教準部請技令系統印發。",D:"品管單位應每90天至主檔核對修護通報數量與正確性，如發現有不合時宜之情況時，應循序反映保指部審查修訂。"}},
{id:218,q:"依「空軍修護管理作業手冊」第一章第七節「修護適用法規及文件之運用與考核」規範，何者為非？",a:"D",options:{A:"標準施工程序簿(Standard Operation Procedure，簡稱SOP)：修護單位對具有翻修及檢視(CR2、CR4)能量之武器裝備，均應依據上述參考資料，編訂武器裝備適用之標準施工程序簿。",B:"標準檢驗紀錄(Standard Inspection Procedure，簡稱SIP)：配合施工程序執行修護工作時，武器裝備重要之基本資料、工作步驟、量測數據、檢試紀錄等，應編訂標準檢驗紀錄簿。",C:"工作單位接獲新版修護法規、技術文件或技術通報等增修訂資料時，即應將受影響項目增修訂於標準版本內，並追溯已印發使用中之相關程序簿。",D:"已核授專長人員完成所列之技術文件研讀並經考評合格後，應抽問其中1/2項目是否熟諳，並紀錄於備考欄內；抽測結果不合格者，得要求考評官重新檢討研讀。"}},
{id:219,q:"依「空軍修護管理作業手冊」第一章第七節「修護適用法規及文件之運用與考核」規範，何者為非？",a:"B",options:{A:"單位主管應指派資深之官、士擔任指導及考評教官，督導所屬人員研讀情況，另考評教官人員亦需建立「修護通用文件個人研讀及熟諳程度紀錄表」，並接受上一級主管(管)督導。",B:"單位中隊長或課長(含)以上之主管(管)於「修護通用文件個人研讀及熟諳程度紀錄表」單位主官欄簽證，由大隊長或廠長簽署核後按表實施。",C:"考評教官在填寫單位人員研讀技術文件時，應依據其級職、專長、程度及工作性質，並參考「修護通用文件研讀熟諳程度及對象參考表」，訂定各項文件研讀熟諳標準，以利工作",D:"技術文件之研讀可配合在職訓練、技勤訓練等時機，以個人或工作班方式實施，但常有可佐證之研讀紀錄或個人研讀心得筆記。"}},
{id:220,q:"依「空軍修護管理作業手冊」第一章第三節「修護制度」規定，何者為非？",a:"D",options:{A:"使用單位修護：由使用單位執行，性質著重於預防性修護",B:"場站修護：由場站單位執行，其性質著重於糾正性修護。",C:"工廠修護：由專業工廠執行之，其性質屬修復性修護。",D:"本軍飛行程序度，區分為一般性修復制度、預防性修護制度及執行性修護制度。"}},
{id:221,q:"依「空軍修護管理作業手冊」第一章第五節「修護職掌」各指揮部及各聯隊職掌，何者為非？",a:"D",options:{A:"策訂所屬各單位修護能量、工作範圍並督導實施及考核成效",B:"對所屬各單位之組織、人力管理運用與調整、教育訓練、裝備器材、工作紀律、設施需求等提供建議與督導考核。",C:"對所屬修護品質管制計畫之策訂與督導及意外事件之原因分析、預防改進措施之擬訂與考核。",D:"依據司令部政策、指示或命令，辦理本軍各項修護政策、制度、組織、與程序及業務規程、軍品規範等之編。"}},
{id:222,q:"依「空軍修護管理作業手冊」第二章第一節第一款「高級裝備檢查」規範，何者為正確？",a:"D",options:{A:"重大缺點：凡人為疏忽，維護不當，導致裝備損壞/影響任務執行/安全顧慮之缺點，須當時立即改正。",B:"限期改正缺點：凡人為疏忽，維護不當，導致裝備局部受損，功能降低等之缺點，須於3日內改正完畢。",C:"一般性缺點：凡維護疏忽，未導致裝備受損，且不影響裝備正常使用之缺點，應速改正。",D:"以上皆是"}},
{id:223,q:"依「空軍修護管理作業手冊」第二章第一節第二款「各級主官裝備檢查」規範，何者為正確？",a:"D",options:{A:"分隊(連)級主官須全程親自檢查；中隊(營)級以上單位主官得視需要遴選適任專業人員成立檢查小組，納編之人員應熟諳所負責檢查裝備之維護保養依據、程序、操作規定等，並依檢查重點及項目配合主官",B:"司令部頒辦理全軍性講習；官校、各飛行聯隊及松指部須於每年1、7月份辦理地區性講習。",C:"中隊(營)級以上單位須於每年年底前訂定次年「年度主官裝備檢查實施計畫」呈報上一級單位審核，並按計畫實施檢查；於檢查完成後彙整檢查情況編撰執行報告，呈報上一級",D:"以上皆是"}},
{id:224,q:"依「空軍修護管理作業手冊」第二章第一節第二款「各級主官裝備檢查」規範，何者為非？",a:"B",options:{A:"各單位應針對裝備額定存量表(AF-158表)所列裝備造冊，每次檢查除新增及不妥善裝備為必檢項目外，餘妥善裝備每項抽查50%(小數點部分採無條件進入法取整數方式計",B:"每件裝備每年至少應受大隊(旅)級以下各級主官兩次以上之檢查。",C:"特業單位(如：防空、戰管、通航資、氣象部隊等)因分防駐地因素，可運用區分單位方式以不扭觸週期抽查次數原則、適當調整裝備抽查比例執行主官裝",D:"各級主官裝備檢查紀錄簿，應裝訂成冊，由主官本人或指定專人親自保管，並隨時兼查缺點之時改正；檢查紀錄簿應保存一年，超過時限得辦理銷毀。"}},
{id:225,q:"依「空軍修護管理作業手冊」第二章第一節第二款「修護標準化考核」規範，何者正確？",a:"D",options:{A:"筆試測驗係配合執行本軍後勤修護人員年度定期技術評鑑，各考驗官應依各單位作業特性、職務階層、業務性質之相異，選擇不同題目，管理階層官測驗題目以管理性、專業性法規、技令為主(如各修護管",B:"專業技能考核，由各考驗官依工作人員在工廠、場站、使用單位等實際負責之修護專業工作項目，以實作方式考驗個人或工作班對修護施工程序及使用之裝備、工具等之正確性與遵守工作紀律習性及技能之熟練度等",C:"各單位依據專業檢修、操作技術文件及相關維護手冊等資料，建立並長期保持一技術性筆試測驗題庫，可配合標準化單位技術評鑑等時機使用。",D:"以上皆是"}},
{id:226,q:"依「空軍修護管理作業手冊」第二章第七節「時限技術命令之處理及管制」規範，何者為非？",a:"D",options:{A:"立即執行：係因影響安全情況因素而頒發。此等情況若未立即加以改正，將對飛安、人員或裝備造成最重之損害。",B:"緊急執行：係基於作戰之需要或潛在之各種危險情況而頒發。此等情況若未及時加以改正，將可使人員遭受損害，裝備蒙受損壞或使作戰效率降低。此等危害安全及含有危險性之情況，預計僅能容許存在一短暫之時限，必須儘速予以改正。",C:"經常執行：係基於改正武器/裝備在材料、機械、操作、或戰術等方面之缺陷而頒發。此等缺陷若未適時加以改正",D:"以上皆是"}},
{id:227,q:"依「空軍修護管理作業手冊」第二章第三節第一款「修製工作場地安全檢查要領」規範，何者正確？",a:"B",options:{A:"消防裝備之每週檢查由使用單位派專人執行，並記錄備查；每月由單位之消防管理員，執行單位內所有消防設施之安全檢查。",B:"職業安全衛生委員會視各單位特性及編組狀況設置之，委員不得少於七人。",C:"各修製工作場所應指定適當(已接受相關職業安全或危險機械設備訓練合格)人員兩員，擔任工場安全檢查管理助理員，負責承辦工場內部相",D:"各單位每季至少實施2小時之工場安全訓練，由職業安全衛生管理單位配合訓練單位納入課表實施，並將教材、教案及測驗卷留存備查。"}},
{id:228,q:"依「空軍修護管理作業手冊」第二章第三節第一款「修製工作場地安全檢查要領」規範，何者正確？",a:"D",options:{A:"發生個案工場災害事故，除依國防部訂頒之相關法令規章及參考職業安全衛生法罰則規定辦理，並限期於2週內檢討各級失職人員責任，發布懲處。",B:"各單位對推行工場安全各項方案之實施成果、安全檢查、意外事件統計分析以及安全會議紀錄資料，應專卷保存完整，備供上級或勞檢所隨時查考，並列為年度視察項目之一。",C:"單位內部為保持事故紀錄，由基層人員完成事故調查報告，經主官(管)簽證後送交職業安全衛生管理單位檢討分析處理後，據以訂定下年度加強工場安全訓練之參考。並製作工場安全檢查通報，張貼於明",D:"以上皆是"}},
{id:229,q:"依「空軍修護管理作業手冊」第二章第四節「外物預防及受損發動機處理」規範，何者為非？",a:"B",options:{A:"尤應注意停機坪及機堡索機樁孔等，試車區場地之裂縫與隙縫之清除，若地面有龜裂及風化現象標示出來應儘速施工改善。",B:"每半年召開外物預防檢討會議乙次，以研討改善情況及謀求防止外物之決策。",C:"各停機坪、跑道、滑行道、機(庫)堡地坪，均應視當加以管理，每日至少應檢查1次，確保無外物之存在。",D:"於飛機開車後應避開飛機進氣危險區域，試車完畢後，應以強光再詳細檢查發動機有無外物損傷(Foreign Object Damage，以下簡稱FOD)現象及進氣段之機件附件。"}},
{id:230,q:"依「空軍修護管理作業手冊」第三章第五節「附件能量管理及附件修護作業」規範，何者為非？",a:"B",options:{A:"研(試)修復件經部隊測試合格後，即為妥善件，若屬測試單位急缺待件項目，則由該單位聯整保指部及研(試)修單位後辦理留用",B:"「飛安顧慮」係指研修復件安裝於飛機上執行在地面通電、通壓或起動發動機後，可驗證其功能是否符合規範，需執行飛測時，不影響飛機操控，有安全顧慮者謂之。",C:"測試單位需填具研(試)修件維修及測試情況回復表，回覆研(試)修單位，並由研(試)修單位填寫研(試)修件使用情況表，以辦理除帳作業。",D:"屬一般測試合格件，測試單位填具研(試)修件維修及測試情況回復表，證明(試)修妥件調運研(試)修單位，並由研(試)修單位填寫研(試)修件使用情況表，以辦理繳庫作業。"}},
{id:231,q:"依「空軍修護管理作業手冊」第三章第五節「附件能量管理及附件修護作業」規範，何者為非？",a:"D",options:{A:"第一類：飛行器無備援系統支援且飛行手冊(專業技令)無緊急應變程序，會阻礙持續安全飛航與落地，導致降低安全限界、低性能或喪失飛航操作能力之零組件。",B:"第二類：飛行器無備援系統支援且飛行手冊(專業技令)緊急應變程序不足，不會阻礙持續安全飛航與落地，但會降低航空器性能或降低飛航組員面對異常情況之操作能力或導致失效之零組件。",C:"第三類：飛行器有備援系統支援且飛行手冊(專業技令)有詳訂緊急應變程序，不會影響持續安全飛航與落地之零組件。",D:"第三類：研(試)製件憑航驗證程序比照研(試)修件作業模式辦理；另非屬飛行器之器材亦均以有無備援系統及技術文件之緊急應變程序執行分類驗證作業。"}},
{id:232,q:"依「空軍修護管理作業手冊」第五章第二節「飛機修護」規範，何者為非？",a:"B",options:{A:"依據各型飛機延遲缺點改正相關技術手冊及同機種相互研討情況，擬訂可過K表項目及實施細則，函送空軍保修指揮部審核後發布實施。",B:"依據技令 00-20-1 太空載具檢查及文件規定「除紅/符號外，任何未改正缺點可轉登至AFTO 781K表上」",C:"「因缺件或其他原因而未能完工之工作或未改正之缺點，其屬紅「/」或紅「-」符號者，應由品管檢驗人員簽證後轉入 AFTO 781K表「延遲",D:"須將「立即、緊急及經常」等執行時限技令，應立即登載於781K表內，並待執行完竣後簽銷。"}},
{id:233,q:"依「空軍修護管理作業手冊」第五章第三節「發動機修護」規範，何者正確？",a:"D",options:{A:"於發動機或附件接收時，發動機經理官應會同工作單位、品保單位執行交修資料審查及開箱接收檢查，並登載所發現之缺件、損壞或資料不明等情況。",B:"發動機試車妥後，應按相關技令及工作程序實施防，工作單位於於滑油分光合格後兩日內，檢查完成各類施工檢驗記錄及簽證等資料，由生檢單位填製相關之發動機出廠資料(如附表5-26)或完成DLIMS各相關模組內登載之數據審查後，再送品標科於乙週內完",C:"基地修管科科長應依各模組之剩餘壽限，是否已達技令規定之裕度值，以及基地器材調度情況，決定各模組或定更件是否需提前或延後更換，以避免短期內將因模組之更換而拆除發動機，俾符經濟效益。",D:"以上皆是"}},
{id:234,q:"依「空軍修護管理作業手冊」規定，各修護專業及_發現某機急缺某項器材，雖經辦理申請未能獲補時，需求單位器材申請人員，將情況告知使用單位人員，以查詢籌補情況、如確定無法於時限內獲補時，即由使用部隊補管科器材管制官繕製「附件週轉紀錄表」CAFM 991A表，建議附件週轉。",a:"B",options:{A:"飛行線人員",B:"停機線人員",C:"補給人員",D:"經管人員"}},
{id:235,q:"依「空軍修護管理作業手冊」規定，器材週轉後應辦理_（BRK），將器材申請移至拆件工單管制。",a:"B",options:{A:"除帳作業",B:"轉機作業",C:"銷帳作業",D:"紀錄作業"}},
{id:236,q:"依「空軍基地消防手冊」第3章第2節規定，各單位應選派專責人員_定期執行單位滅火、警報及避難設備維護保養。",a:"A",options:{A:"每週",B:"每月",C:"每日",D:"每季"}},
{id:237,q:"依「空軍械彈、爆材管理規定」所規範事項，何者正確？",a:"D",options:{A:"槍械須落實槍械重要組件(如彈匣頂彈簧、槍管、藥室及復進簧總成等)清潔、潤滑作業，以維槍械射擊效能與安全，若發現組件破損應循系統發工鑑修成",B:"主官調職時，應繕造槍械移交清冊，交接雙方應當面實施械彈清點作業，清點無誤後與帳籍管理單位完成移交手續，並記錄備查。",C:"負責械彈保管人員異動時，由單位主管會同確實清點，列冊移交",D:"以上皆是"}},
{id:238,q:"依「空軍械彈、爆材管理規定」所規範事項，何者正確？",a:"D",options:{A:"零箱彈藥(無鉛封者)每次應由清點人員逐顆清點後加貼封條管制。",B:"槍械保養期間由單位值星(日)官及槍械保管人全程監督。",C:"彈藥機動櫃應加裝警示用之交、直流警鈴系統各乙套，電源線不得零亂、裸露，避免電線走火造",D:"以上皆是"}},
{id:239,q:"依「空軍械彈、爆材管理規定」所規範事項，何者為非？",a:"D",options:{A:"械彈管理及清點人員均應按「空軍械彈庫儲及帳籍管理與警戒、衛哨人員安全調查基準表」審查合格，先期完成安全調查始得派任，並按「先查後用」之原則，避免品德不良之人員擔任械、彈",B:"單位械彈管理及清點人員應按「國軍械彈庫儲及帳籍管理與警戒、衛哨人員安全調查基準表」審查合格，先期完成安全調查始得派任",C:"各單位軍械、彈藥庫室內、外均應全面裝設警監系統，且能通視監視軍械及彈藥室大門人員進出、械彈儲存及清點情形，不得有死角",D:"軍械、彈藥室內、外均應全面裝設警監系統，由安全士官(或值勤人員)全時監看，避免產生管理罅隙，並錄影存檔60日以上，維管人員落實每日檢查，俾利系統妥善無死角。"}},
{id:240,q:"依「空軍械彈、爆材管理規定」所規範事項，何者為非？",a:"A",options:{A:"單位針對暴民可能動掣械彈行動，火災及天災等相關應變計畫及措施，應納入「營區安全整體防護計畫」每季實施演練，以確保械彈安全。",B:"每一槍械、彈藥室及其主要組成零件庫，均應建立及覆置「械、彈及其主要組成零件清點紀錄簿」，確實記錄備查，以掌握流向，避免不法情事。",C:"槍械庫房門、窗應加裝警示用之交、直流雙鈴系統各乙套，並配合每週入庫巡檢時機檢測功能是否正常。",D:"各械彈庫房門、箱及櫃等鎖具嚴禁乙支鑰匙可開啟數個鎖具或可互換使用。"}},
{id:241,q:"依「空軍械彈、爆材管理規定」第11條，何者正確？",a:"D",options:{A:"槍械房內部應設置步槍架(檯)、手槍櫃並固定於地(牆)上，各式槍枝(含主要組成零組件及刺刀)，須以輔助或固定設施上鎖",B:"彈藥室各項電器設備須採用防爆設計，電源線不得零亂、裸露，避免電線走火造成彈藥引燃。",C:"槍械庫房應加裝鐵窗(鐵窗之固定螺絲應予以變形至不易拆卸)。",D:"以上皆是"}},
{id:242,q:"依「空軍械彈、爆材管理規定」第11條，何者為非？",a:"B",options:{A:"各式槍械主要組成零件，於接收、撥發、繳回、後送及報廢等進出庫作業時，確依「空軍裝備手工具補給作業手冊」程序辦理，並按庫存紀錄卡(84A卡)對存儲之零附件實施乙次性清點。",B:"每季相關帳籍資料須由單位實際執行清點之實物保管人、帳管人員、單位主官(管)簽證。",C:"保養期間應由單位值星(日)官及槍械保管人全程監督，主官(管)負責督導，並由清潔及檢驗槍械管人確實檢查檢視情況是否良好。",D:"使用單位應每月配合帳籍核對時機，至「主件資訊管理系統」列印所納管槍砲資料，供人員清點查核若有清點不符情形，須立即查明澄清，並反映帳管單位(BEMO)執行異動修訂作業，檢驗"}},
{id:243,q:"依「空軍械彈、爆材管理規定」第14條，何者為非？",a:"A",options:{A:"各單位配合每季帳籍核對時機，由正、副主官(管)實施點乙次。",B:"各級械彈清點，應秉「鍵眼所見、逐一清點」原則，確實逐槍(含主要組成零件及刺刀)逐彈清點，不得目視清點，並確認是否有贋品取代",C:"各單位之械、彈等主要組成零件現存情況應填註於「人員暨裝備(彈藥)進、出紀錄簿」備查。",D:"械彈清點應建立雙重監管(實物與帳籍)，並配合每月帳籍核對及每半年(1、7月)特別清點等時機，由正、副主官(管)實施械彈清點乙次。"}},
{id:244,q:"依「空軍械彈、爆材管理規定」第14條，何者為非？",a:"D",options:{A:"各彈庫對外大門應設置2道鎖，鑰匙打造2套，嚴禁乙人同時擁有彈庫全套鑰匙，開庫時應由督導幹部及庫管人員同單位主官(管)或代理人領用，並於「庫儲鑰匙領用繳回管制紀錄簿」登載備查",B:"各單位應針對進入械彈庫房之人員，無論是保管人執行各項清查(點)、維護保養，領用，均須於「人員暨裝備(彈藥)進、出紀錄簿」內由當事人親自簽名備查",C:"清點官、值星(日)官及保管人輪值交接以不開庫清點為原則，交接雙方須於械、彈庫外監視鏡頭前，安全士官監督下移交鑰匙，共同實施庫外巡查作業(門窗、鎖具、槍械及彈藥是否正常)，並登載於庫區巡查",D:"各單位正副主官(管)每季應入庫實施列管彈藥帳籍檢校乙次。"}},
{id:245,q:"依「空軍裝備手工具補給作業手冊」所規範事項，下列何者為非？",a:"A",options:{A:"使用單位每季應依律定期程將三軍通用通信裝備送至基地通中執行二級保養工作",B:"使用單位應負責裝備申請、繳回、接收等補給帳務及質管帳籍處理。",C:"化生放檢裝備損壞，須由送修單位循陸軍「二級保修補給管理系統」辦理發工轉級",D:"各部隊配賦化生放核裝備，如逾效期，應完成清查並檢報"}},

{id:247,q:"依「空軍零附件補給作業手冊」第12章規定金屬油脂箱每月實施檢查1次並記錄備查與每_個月實施行油脂箱翻滾作業，並擬訂金屬油脂箱檢查紀錄表。",a:"A",options:{A:"3",B:"6",C:"9",D:"12"}},
{id:248,q:"依「空軍潛力計晝戰備手冊」規定，何者正確？",a:"D",options:{A:"為利於單機及現場指揮官明辨專業區分，律定作業人員頭盔顏色，並穿著反光背心。",B:"單機指揮官於不同專業同時執行裝掛任務時，應預先安排作業行程及動線，並全程掌控裝掛進度。",C:"戰機及各項軍械支援裝備，平時應集中保管及維持妥善。",D:"以上皆是"}},
{id:249,q:"依「飛行部隊修護作業手冊」第2章第4節規定，飛機週檢進站前應召開_，討論檢機各項檢查及附加工作，並納入週檢附加工作檢查表(2410表)，送交它份予週檢工作站站長，俾列入週檢程序表中管制執行。",a:"B",options:{A:"每日修護檢討會議",B:"週檢前會議",C:"試飛前會議",D:"勤前提示會議"}},
{id:250,q:"依「國軍械彈爆材管理指導要綱」第11條規定，奉准攜出之槍械應由個人隨身保管，未使用槍械應於清查後集中置於安全處所，並委派_之人員擔任槍前全程監管。",a:"B",options:{A:"至少1員",B:"兩員以上",C:"裝備",D:"執勤"}},
{id:251,q:"依「勞工健康保護規則」第18及21條規定，從事特別危害健康作業，應_或於變更其作業時，實施特殊健康檢查，並將檢查結果分級實施健康管理，屬第四級管理者，經職業醫學科專科醫師評估現場仍有工作危害因子之暴露者，應採取危害控制及相關管理措施。",a:"C",options:{A:"每兩年",B:"每半年",C:"每年",D:"每三年"}},
{id:252,q:"依「零附件補給作業手冊」第12章第1節規定，本軍存儲軍品項目繁多，對規管之軍品均需標示存儲位置……俾可迅速銷派每一器材存放位置，並建立電子庫卡及儲位予以紀錄管",a:"D",options:{A:"帳卡",B:"清點卡",C:"84A卡",D:"電子庫卡"}},
{id:253,q:"依「職業安全衛生設施規則」及「勞工健康保護規則」規定，何者為非？",a:"C",options:{A:"對於高壓氣體容器貯存，盛裝容器與空容器應分區放置",B:"不得於通路上使用臨時配線，但經妥為防護而車輛通過不致損傷其絕緣被覆者，不在此限。",C:"研磨機之研磨輪除為側面研磨型專用外，得使用側面研磨，避免研磨輪偏心研磨。",D:"電氣機具之帶電部分，有因接觸或接近致發生感電之虞者，應設防止感電之護圍"}},
{id:254,q:"依「職業安全衛生設施規則」與「職業安全衛生管理辦法」規定，何者為非？",a:"B",options:{A:"移動梯不得有顯著損傷及腐蝕等現象",B:"防爆電氣設備應每年針對本體及配管(線)等實施檢查",C:"固定式起重機每月應定期執行檢查",D:"高空作業車每年及每年應針對啟動、動力傳動裝置、制動、升降、走行、旋轉、安全裝置及電氣系統等執行定期檢查"}},

{id:256,q:"依本軍「危險性機械及設備管理使用作業規定」，危險性機械及設備由分隊層級(含)以上配合各級_時機執行乙次性檢查，並將檢查情況登載於主官裝檢檢查紀錄表。",a:"C",options:{A:"每日檢查",B:"複檢評鑑",C:"主官裝檢",D:"開機前"}},
{id:257,q:"依本軍「職業安全衛生管理計畫」及「職業安全衛生管理辦法」第12條規定，_至少召開委員會1次，並於會中研討「對雇主擬訂之職業安全衛生政策提出建議」等12項。",a:"A",options:{A:"每3個月",B:"每6個月",C:"每12個月",D:"每24個月"}},
{id:258,q:"依本軍「職業安全衛生管理辦法」及本部112年4月26日圖空後品字第1120098175號令，對所屬新進人員實施安全衛生教育訓練_，針對各項作業評估可能之危害及原因，採取防護裝置或措施，訂定安全衛生作業標準，並針對各項勤務工作落實勤前提示，強化人員危急意識。",a:"B",options:{A:"1小時",B:"3小時",C:"2小時",D:"4小時"}},

  { id: 9, category: "地安官權責", text: "凡司令部所屬之一級單位，須管制（中隊）、（獨立分隊）或（同駐營區）內各單位兼任地安官人員並造冊。", answers: ["中隊", "獨立分隊", "同駐營區"], keyNotes: "兼任地安官造冊列管範圍。" },
  { id: 10, category: "會議制度", text: "地面安全會議為失事預防工作主要部份之一，亦為地安教育方式之一，每季必須召集所屬各單位主官（管）、地安官（兼任地安官）及有關人員舉行（地面安全促進會議）一次。", answers: ["地面安全促進會議"], keyNotes: "每季召開一次。" },
  { id: 11, category: "督導與檢查", text: "經地面安全檢查發現之缺點，旨在（改正缺失），預防地面失事，促進地面安全，如情況嚴重或改正不力致（缺點重犯）者，得視情況（簽請議處）。", answers: ["改正缺失", "缺點重犯", "簽請議處"], keyNotes: "重犯得視情況簽請議處。" },
  { id: 12, category: "會議制度", text: "各部隊每季召開地面安全促進會議，可配合（每季督察會報）合併舉行，擴大地安會議紀錄須於會議後（5日）呈主官核閱備查。", answers: ["每季督察會報", "5日"], keyNotes: "時限：會議後5日內呈核。" },
  { id: 13, category: "督導與檢查", text: "地面安全檢查分類計有地安（業務檢查）、（週期檢查）、（專題檢查）、（特別檢查）及（不定期檢查）等5類。", answers: ["業務檢查", "週期檢查", "專題檢查", "特別檢查", "不定期檢查"], keyNotes: "常考5類檢查劃分。" },
  { id: 14, category: "文宣宣導", text: "地面失事公報運用分發至（分隊）、（連級）階層提供單位參考改進，並影印揭批後（張貼公布）。", answers: ["分隊", "連級", "張貼公布"], keyNotes: "下發分隊/連級揭批張貼。" },
  { id: 15, category: "督導與檢查", text: "地安檢查在發掘影響營地地面安全之因素，提出（詳細之分析）、擬訂（改進措施）而付諸實施，並據以修訂與增強失事預防計畫。", answers: ["詳細之分析", "改進措施"], keyNotes: "分析並擬訂改進措施。" },
  { id: 16, category: "文宣宣導", text: "地安（走廊）及（地安園地）應公布有關安全資料如：交通事故、火災、工作不慎及各種職業災害等重大事件相關資料至少（每季）更新一次，以維新穎。", answers: ["走廊", "地安園地", "每季"], keyNotes: "更新頻率：至少每季一次。" },
  { id: 17, category: "督導與檢查", text: "地安（督導頻率）（基層單位及中隊）應1日執行1次，（大隊、作戰隊）、組、科、室、中心，2日執行1次，聯隊、指揮部（3日）執行1次。", answers: ["督導頻率", "基層單位及中隊", "大隊、作戰隊", "3日"], keyNotes: "基層/中隊每日；大隊2日；聯隊/指揮部3日。" },
  { id: 18, category: "督導與檢查", text: "地安週期檢查，應（納編各單位兼任地安官），成立汽、機車檢查小組負責基地內（行車安全）檢查，每月至少1次，各次檢查結果應作完整之紀錄備查。", answers: ["納編各單位兼任地安官", "行車安全"], keyNotes: "汽機車檢查小組：每月至少1次。" },
  { id: 19, category: "失事調查", text: "地面失事調查工作項目包含（失事之通知）、（組織編組）、（調查之執行）及（調查報告編製）。", answers: ["失事之通知", "組織編組", "調查之執行", "調查報告編製"], keyNotes: "調查工作四大流程項目。" },
  { id: 20, category: "事件等級劃分", text: "地安事件等級分類計分（一級事件）、（二級事件）、（三級事件）及（四級事件）及（地安通報）。", answers: ["一級事件", "二級事件", "三級事件", "四級事件", "地安通報"], keyNotes: "區分四級事件加地安通報。" },
  { id: 21, category: "事件等級劃分", text: "地安事件等級分類中，凡因地面失事，造成本軍或非本軍人員（死亡3人）（含）以上，或財產毀損金額超過新臺幣1,000萬元（含）以上者，屬於一級事件。", answers: ["死亡3人", "1,000萬元"], keyNotes: "【一級事件】：死亡3人(含)以上 或 財損≥1,000萬元。" },
  { id: 22, category: "事件等級劃分", text: "地安事件等級分類中，凡因地面失事，造成本軍或非本軍人員（死亡2人）（含）以下，或財產毀損金額超過新臺幣600萬元（含）以上，未達新臺幣1,000萬元者，屬於二級事件。", answers: ["死亡2人"], keyNotes: "【二級事件】：死亡2人(含)以下 或 財損600萬～1,000萬元。" },
  { id: 23, category: "事件等級劃分", text: "地安事件等級分類中，凡因地面失事，造成本軍或非本軍人員（一、二等傷殘），或財產毀損金額超過新臺幣360萬元（含）以上，未達新臺幣600萬元者，屬於（三級事件）。", answers: ["一、二等傷殘", "三級事件"], keyNotes: "【三級事件】：一、二等傷殘 或 財損360萬～600萬元。" },
  { id: 24, category: "事件等級劃分", text: "地安事件等級分類中，凡因地面失事，造成本軍或非本軍人員（三等傷殘或重度機能障礙），或財產毀損金額超過新臺幣100萬元（含）以上，未達新臺幣360萬元者，屬於（四級事件）。", answers: ["三等傷殘或重度機能障礙", "四級事件"], keyNotes: "【四級事件】：三等傷殘/重度機能障礙 或 財損100萬～360萬元。" },
  { id: 25, category: "事件等級劃分", text: "地安事件等級分類中，凡因地面失事，造成造成本軍或非本軍人員（受傷或輕度機能障礙）或財產毀損，未達新臺幣100萬元者，屬於（地安通報）。", answers: ["受傷或輕度機能障礙", "地安通報"], keyNotes: "【地安通報】：受傷/輕度障礙 或 財損未達100萬元。" },
  { id: 26, category: "通報時限", text: "地安事件發生，單位獲報後以最迅速方法，地安官或兼任地安官於（營內失事30分鐘）/（營外失事1小時）內通知司令部業務主管單位及司令部督察長室飛行安全組，並於（6小時內）完成初報與飛安服務整合電子系統建置。", answers: ["營內失事30分鐘", "營外失事1小時", "6小時內"], keyNotes: "重要時限：營內30分、營外1小時；6小時完成初報系統建置。" },
  { id: 27, category: "責任歸屬", text: "調職人員恰於調職期間，尚未向新單位報到時之失事案件，由（原單位）為失事責任單位，若已向新單位報到後發生之失事案件，則（新單位）為失事責任單位。", answers: ["原單位", "新單位"], keyNotes: "報到前原單位負責，報到後新單位負責。" },
  { id: 28, category: "通報與處分", text: "發生失事如為例假日或非辦公時間，由（部隊地面安全兼管單位值班人員）聯繫司令部督察長室值日官。如逾期呈報地安事件，則失職人員及直屬主管應依權責專案檢討報部。", answers: ["部隊地面安全兼管單位值班人員"], keyNotes: "假日由值班人員聯繫督察長室值日官。" },
  { id: 29, category: "責任歸屬", text: "發生地安事件時，其失事主因經鑑定係由部隊人員因素導致者，或由環境因素所掌控，或原因不明無法澄清者，所屬單位（失事責任單位）。", answers: ["失事責任單位"], keyNotes: "人員因素、環境因素或原因不明皆由所屬單位負責。" },
  { id: 30, category: "責任歸屬", text: "發生地安事件時，人員、裝備、車輛及設施其編制在甲單位，而為乙單位借用時，發生地面失事，則（乙單位）為失事責任單位。", answers: ["乙單位"], keyNotes: "借用期間發生失事，借用單位（乙單位）為責任單位。" },
  { id: 31, category: "地安官權責", text: "失事預防工作之成功，有賴地安官之（能力）與（積極）之工作熱忱，審慎選任與其經常接觸，可使失事預防工作發揮至最高成效。", answers: ["能力", "積極"], keyNotes: "能力與積極熱忱。" },
  { id: 32, category: "失事調查", text: "如失事事件涉及（故意破壞）時，由（監察人員）執行調查。", answers: ["故意破壞", "監察人員"], keyNotes: "涉及故意破壞由監察部門調查。" },
  { id: 33, category: "通報時限", text: "地面失事發生後，單位督察科（室）須每（2）日將最新解說電傳司令部（督察長室飛安組），並登錄於（飛安服務整合系統）直至案件（完成續報）。", answers: ["2", "督察長室飛安組", "飛安服務整合系統", "完成續報"], keyNotes: "每2日電傳續報一次。" },
  { id: 34, category: "失事調查", text: "凡因本軍活動而達致人員傷害或財產毀損（三級含以上）地安事件者，須於45日內調查完畢（如遇特殊情況，例如失事原因須等待檢驗方特能確定者，可請求延期呈報）。", answers: ["三級含以上", "45日"], keyNotes: "三級以上案件須於45日內完成調查。" },
  { id: 35, category: "責任歸屬", text: "基地地面安全官對同駐營區單位之任何地面失事，須負責（調查）及填寫（地面失事報告），送該屬單位參辦，惟同駐營區單位有現職地面安全官時，則可由同駐營區單位自行辦理。", answers: ["調查", "地面失事報告"], keyNotes: "基地地安官具協同調查與填表權責。" },
  { id: 36, category: "通報時限", text: "凡因地面失事導致本軍財產受損，無論損傷程度，除依規定時限通報外，失事調查必須迅速審慎，並將受損照片（一式2張）於（1日）內電傳司令部督察長室備查；另失事調查報告表亦需檢附受損照片。", answers: ["一式2張", "1日"], keyNotes: "受損照片一式2張、1日內電傳。" },
  { id: 37, category: "計畫與編組", text: "各單位應設立（地安指示）及（地面失事案例）檔案，存作參考改進。", answers: ["地安指示", "地面失事案例"], keyNotes: "建立指示與案例專卷存檔。" },
  { id: 38, category: "現場處置", text: "如遇地面失事，必須儘速趕赴現場，規劃（戒護區域），責適員管制失事現場，繪製（準確失事現場圖），攝取（所需照片），現場未經調查前不可搬離失事殘骸破片，正確紀錄損失情況。", answers: ["戒護區域", "準確失事現場圖", "所需照片"], keyNotes: "現場管制四大要項：戒護、繪圖、拍照、不可搬動殘骸。" },
  { id: 39, category: "責任歸屬", text: "涉及兩個單位之地面失事調查，部隊防其他基地發生地安事件時，由（原屬基地）負責調查，距離失事現場最近之基地，則應作失事後之各項緊急處置。", answers: ["原屬基地"], keyNotes: "原屬基地主責調查，就近基地作緊急處置。" },
  { id: 40, category: "責任歸屬", text: "凡地安事件涉及兩個單位且屬不同之基地時，如甲基地移駐至乙基地，如因指揮、通信、裝備、設施等不當而發生失事，應聯合實施失事調查，並由兩基地人員共同召開失事審查會議，由（乙基地）負責召集，會後由（失事責任單位）撰寫失事調查報告。", answers: ["乙基地", "失事責任單位"], keyNotes: "乙基地召集會議，責任單位撰寫報告。" },
  { id: 41, category: "通報內容", text: "地安事件初報內容應包括（失事發生日期及時間）、發生地點、失事單位、（失事人員職級姓名）、失事當時任務、失事種類、（失事經過）、（初步原因分析）、（失事人員狀況）、裝備或設施損壞情形、已有之處置含憲警及醫療單位處理情形。", answers: ["失事發生日期及時間", "失事人員職級姓名", "失事經過", "初步原因分析", "失事人員狀況"], keyNotes: "初報必備要項，包含人、事、時、地、物及處置。" },
  { id: 42, category: "地安官權責", text: "地安官應偵察存在於作戰、訓練、（修護、補給）、運輸、通電、（戰、航管）、（基地勤務）、設施、（軍械）、氣象、航醫等各項工作上影響地安之缺點。", answers: ["修護、補給", "戰、航管", "基地勤務", "軍械"], keyNotes: "地安官巡查督考之各業務專業範疇。" },
  { id: 43, category: "地安官權責", text: "地安官應（分析及歸納）各項缺點，即時建議主官採取（必要改正措施）。", answers: ["分析及歸納", "必要改正措施"], keyNotes: "分析歸納並建議主官改進措施。" },
  { id: 44, category: "地安官權責", text: "另（兼任地安官）負責該單位地面失事預防工作之推展，如發生地面失事，應（查明原因）、（責任）及（建議改進辦法）等，報告其上級地安業務單位。", answers: ["兼任地安官", "查明原因", "責任", "建議改進辦法"], keyNotes: "兼任地安官事故呈報三核心。" },
  { id: 45, category: "地安官權責", text: "凡司令部所屬之一級單位，應管制中隊、獨立分隊或相等單位以上（包含同駐營區內各單位）兼任地安官人員並造冊；另（兼任地安官異動）時，須報告其（上級地安業務單位核備）。", answers: ["兼任地安官異動", "上級地安業務單位核備"], keyNotes: "人員異動需向上核備。" },
  { id: 46, category: "職安法規", text: "依「職業安全衛生設施規則」規定之工作場所安全衛生設備、措施之最低標準，各單位應以此改善所屬不安全之（工作環境）及（個人防護裝備維護）。", answers: ["工作環境", "個人防護裝備維護"], keyNotes: "職安最低標準防護。" },
  { id: 47, category: "職安法規", text: "各部隊、後勤指揮部及學校於部隊長下轄聯隊部、指揮部、校部應設置（職業安全衛生委員會），由工場安全檢查主管部門負責規劃及推動工場安全檢查業務。", answers: ["職業安全衛生委員會"], keyNotes: "設置職業安全衛生委員會規劃推動。" },
  { id: 48, category: "失事調查", text: "失事調查之調查官必須儘速趕赴現場，如情況許可下，應（訪談受傷人員）並特別注意受傷人員身體上或精神上之特徵，並根據醫師診斷（記錄其受傷程度）；另亦儘速（會見目擊失事人員），以聽取失事各方面之敘述，由在場目擊人員自由敘述其所見之情況，避免採取官式詢問態度。", answers: ["訪談受傷人員", "記錄其受傷程度", "會見目擊失事人員"], keyNotes: "訪談傷者、記錄傷勢、會見目擊證人。" },
  { id: 49, category: "工場安全", text: "繪製工作場地安全檢查要領就是防範（危險事故）的發生，藉由安全檢查的方式，來發現不安全之設備或作業行為，加強工作人員的安全意識、喚起工作人員平時注意安全、人人從觀念上重視安全，以達成零災害的理想目標。", answers: ["危險事故"], keyNotes: "安檢目的在防範危險事故、達零災害。" },
  { id: 50, category: "現場處置", text: "各單位發生工場災害時，應派員調查，非經調查人員許可（不得移動或破壞）現場，不論有無人員傷亡，均應按規定程序處理，必要時應組成專案小組審慎處理之。", answers: ["不得移動或破壞"], keyNotes: "現場保全：非經許可不得移動或破壞。" },
  { id: 51, category: "消防安檢", text: "滅火器應分別固定放置於取用方便之明顯處所，並以紅色、紅白相間條紋或指標，確實標明其位置，懸掛於牆壁或放置於箱中之滅火器，其上端與地面距離，十八公斤以上者不得超過（1）公尺，十八公斤以下者不得超過（1.5）公尺。", answers: ["1", "1.5"], keyNotes: "重要考點：≥18kg 不得超過1公尺；<18kg 不得超過1.5公尺。" },
  { id: 52, category: "職安法規", text: "工作場所內為避免工作人員受噪音之危害，各單位應購置耳塞、耳罩等防護裝備，尤其超過（90）分貝者，一律要求工作人員使用噪音防護裝備。", answers: ["90"], keyNotes: "防護裝備臨界門檻：90分貝。" },
  { id: 53, category: "職安法規", text: "燈盞裝置應採用適合工作性質之燈盞及日光燈為原則，燈泡須完全包於戴於玻璃罩中，易燃、易爆工作地區應使用（防爆燈罩）。", answers: ["防爆燈罩"], keyNotes: "易燃易爆地區嚴格要求防爆燈罩。" },

function handleMcqModeChange() {
  startNewMcqQuiz();
}

function startNewMcqQuiz() {
  const mode = document.getElementById('mcqModeSelect').value;
  mcqUserAnswers = {};
  mcqPage = 1;
  mcqShowAnswers = false;
  mcqFilterWrongOnly = false;
  document.getElementById('mcqFilterWrongBtn').classList.remove('bg-amber-100', 'text-amber-800');

  const submitBtn = document.getElementById('mcqSubmitExamBtn');

  if (mode === 'practice') {
    mcqIsExam = false;
    mcqActiveList = [...mcqData];
    submitBtn.classList.add('hidden');
  } else {
    mcqIsExam = true;
    submitBtn.classList.remove('hidden');
    let count = 20;
    if (mode === 'exam-50') count = 50;
    if (mode === 'exam-100') count = 100;
    if (mode === 'exam-all') count = mcqData.length;
    mcqActiveList = [...mcqData].sort(() => 0.5 - Math.random()).slice(0, count);
  }

  document.getElementById('mcqSearchInput').value = '';
  renderMcqList();
}

function renderMcqList() {
  const container = document.getElementById('mcqListContainer');
  container.innerHTML = '';

  let listToRender = mcqActiveList;

  // Filter wrong only if enabled
  if (mcqFilterWrongOnly) {
    listToRender = listToRender.filter(item => {
      const u = mcqUserAnswers[item.id];
      return u && u !== (item.a || item.ans);
    });
  }

  // Pagination calculation
  const total = listToRender.length;
  const totalPages = Math.ceil(total / MCQ_PAGE_SIZE) || 1;
  if (mcqPage > totalPages) mcqPage = totalPages;

  const start = (mcqPage - 1) * MCQ_PAGE_SIZE;
  const pageItems = listToRender.slice(start, start + MCQ_PAGE_SIZE);

  if (pageItems.length === 0) {
    container.innerHTML = `
      <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
        <p class="text-slate-400 text-sm">無符合條件的題目。</p>
      </div>
    `;
    document.getElementById('mcqPaginationBar').classList.add('hidden');
    updateMcqStats();
    return;
  }
  document.getElementById('mcqPaginationBar').classList.remove('hidden');
  document.getElementById('mcqPageIndicator').innerText = `第 ${mcqPage} / ${totalPages} 頁 (共 ${total} 題)`;

  pageItems.forEach((qItem, index) => {
    const card = document.createElement('div');
    card.className = "bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4";
    card.id = `mcq-card-${qItem.id}`;

    const correctAns = qItem.a || qItem.ans;
    const userChoice = mcqUserAnswers[qItem.id];

    let optButtons = '';
    ['A', 'B', 'C', 'D'].forEach(letter => {
      let optText = qItem.options ? qItem.options[letter] : '';
      if (!optText && qItem.o) optText = qItem.o[letter.charCodeAt(0) - 65];

      let btnClass = 'opt-btn text-left p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-medium w-full flex items-center gap-2';

      if (userChoice) {
        if (letter === correctAns) {
          btnClass += ' opt-selected-correct';
        } else if (userChoice === letter) {
          btnClass += ' opt-selected-wrong';
        }
      } else if (mcqShowAnswers && letter === correctAns) {
        btnClass += ' opt-selected-correct';
      }

      const disabledAttr = (userChoice && !mcqIsExam) ? 'disabled' : '';

      optButtons += `
        <button class="${btnClass}" onclick="selectMcqAnswer(${qItem.id}, '${letter}')" ${disabledAttr}>
          <span class="font-bold min-w-[20px]">(${letter})</span>
          <span>${optText}</span>
        </button>
      `;
    });

    let feedbackHtml = '';
    if (userChoice && !mcqIsExam) {
      const isRight = userChoice === correctAns;
      feedbackHtml = `
        <div class="p-3 rounded-xl text-xs sm:text-sm font-medium ${isRight ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200' : 'bg-rose-50 dark:bg-rose-950/60 text-rose-800 dark:text-rose-200'}">
          ${isRight ? '✔ 回答正確！' : `✖ 回答錯誤。正確答案為：<strong>(${correctAns}) ${qItem.options[correctAns]}</strong>`}
        </div>
      `;
    }

    card.innerHTML = `
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-1 rounded-lg bg-blue-50 dark:bg-slate-700 text-brand-600 dark:text-brand-300 font-bold text-xs">
            題號 ${qItem.id}
          </span>
          <span class="text-xs text-slate-400">單選題</span>
        </div>
        <div>
          ${userChoice ? (userChoice === correctAns ? '<span class="text-xs font-bold text-emerald-600">答對</span>' : '<span class="text-xs font-bold text-rose-600">答錯</span>') : '<span class="text-xs text-slate-400">未作答</span>'}
        </div>
      </div>
      <div class="text-sm sm:text-base font-semibold leading-relaxed">
        ${qItem.q}
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
        ${optButtons}
      </div>
      ${feedbackHtml}
    `;

    container.appendChild(card);
  });

  updateMcqStats();
}

function selectMcqAnswer(qid, choice) {
  mcqUserAnswers[qid] = choice;
  renderMcqList();
}

function updateMcqStats() {
  const answeredCount = Object.keys(mcqUserAnswers).length;
  let correctCount = 0;
  let wrongCount = 0;

  for (let qid in mcqUserAnswers) {
    const item = mcqData.find(x => x.id == qid);
    if (item) {
      const correctAns = item.a || item.ans;
      if (mcqUserAnswers[qid] === correctAns) correctCount++;
      else wrongCount++;
    }
  }

  document.getElementById('mcqStatTotal').innerText = mcqActiveList.length;
  document.getElementById('mcqStatAnswered').innerText = answeredCount;
  document.getElementById('mcqStatCorrect').innerText = correctCount;
  document.getElementById('mcqStatWrong').innerText = wrongCount;
  const acc = answeredCount > 0 ? ((correctCount / answeredCount) * 100).toFixed(1) : 0;
  document.getElementById('mcqStatAccuracy').innerText = `${acc}%`;
}

function mcqPrevPage() {
  if (mcqPage > 1) {
    mcqPage--;
    renderMcqList();
    window.scrollTo({ top: 120, behavior: 'smooth' });
  }
}

function mcqNextPage() {
  const totalPages = Math.ceil(mcqActiveList.length / MCQ_PAGE_SIZE);
  if (mcqPage < totalPages) {
    mcqPage++;
    renderMcqList();
    window.scrollTo({ top: 120, behavior: 'smooth' });
  }
}

function handleMcqSearch() {
  const q = document.getElementById('mcqSearchInput').value.trim().toLowerCase();
  if (!q) {
    mcqActiveList = [...mcqData];
  } else if (!isNaN(q)) {
    const num = parseInt(q);
    mcqActiveList = mcqData.filter(i => i.id === num);
  } else {
    mcqActiveList = mcqData.filter(i => {
      const qText = i.q.toLowerCase();
      const opts = Object.values(i.options || {}).join(' ').toLowerCase();
      return qText.includes(q) || opts.includes(q);
    });
  }
  mcqPage = 1;
  renderMcqList();
}

function toggleMcqAnswers() {
  mcqShowAnswers = !mcqShowAnswers;
  renderMcqList();
}

function toggleFilterWrong() {
  mcqFilterWrongOnly = !mcqFilterWrongOnly;
  const btn = document.getElementById('mcqFilterWrongBtn');
  if (mcqFilterWrongOnly) {
    btn.classList.add('bg-amber-100', 'text-amber-800');
    btn.innerText = '顯示全部題目';
  } else {
    btn.classList.remove('bg-amber-100', 'text-amber-800');
    btn.innerText = '只看錯題';
  }
  mcqPage = 1;
  renderMcqList();
}

function resetMcqProgress() {
  mcqUserAnswers = {};
  mcqShowAnswers = false;
  mcqFilterWrongOnly = false;
  renderMcqList();
}

function submitExam() {
  let correctCount = 0;
  mcqActiveList.forEach(item => {
    const correctAns = item.a || item.ans;
    if (mcqUserAnswers[item.id] === correctAns) correctCount++;
  });
  const total = mcqActiveList.length;
  const score = Math.round((correctCount / total) * 100);

  document.getElementById('modalScoreText').innerText = `${score} 分`;
  document.getElementById('modalDetailText').innerText = `本次測驗共 ${total} 題，答對 ${correctCount} 題，答錯 ${Object.keys(mcqUserAnswers).length - correctCount} 題，未作答 ${total - Object.keys(mcqUserAnswers).length} 題。`;
  document.getElementById('scoreModal').classList.remove('hidden');
  document.getElementById('scoreModal').classList.add('flex');

  mcqIsExam = false;
  document.getElementById('mcqSubmitExamBtn').classList.add('hidden');
  renderMcqList();
}

function closeScoreModal() {
  document.getElementById('scoreModal').classList.add('hidden');
  document.getElementById('scoreModal').classList.remove('flex');
}

function startSafetyQuiz(count) {
  const shuffled = [...SAFETY_QUESTIONS].sort(() => 0.5 - Math.random());
  const selected = shuffled.slice(0, Math.min(count, SAFETY_QUESTIONS.length));

  safetyQuizState = {
    active: true,
    questions: selected,
    currentIndex: 0,

    userAnswers: {}
  };

  document.getElementById('safetyQuizSetupCard').classList.add('hidden');
  document.getElementById('safetyQuizResultPanel').classList.add('hidden');
  document.getElementById('safetyQuizRunningPanel').classList.remove('hidden');

  renderActiveSafetyQuizQuestion();
}

function renderActiveSafetyQuizQuestion() {

  document.getElementById('safetyQuizProgressText').innerText = `第 ${currentIndex + 1} / ${questions.length} 題`;

    `;
    questionHtml = questionHtml.replace(`（${ans}）`, `（${inputTag}）`);
  });

  const card = document.getElementById('safetyQuizQuestionCard');
  card.innerHTML = `
    <div class="flex items-center justify-between text-xs text-slate-400">
      <span class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-700 font-semibold text-slate-600 dark:text-slate-300">原題號：第 ${current.id} 題</span>
      <span>類別：${current.category}</span>
    </div>

    <div class="text-sm sm:text-base leading-relaxed text-slate-800 dark:text-slate-100 font-medium">
      ${questionHtml}
    </div>

    <div id="safetyQuizFeedbackBox" class="hidden p-3 rounded-xl text-xs sm:text-sm font-medium"></div>

    <div class="pt-4 flex items-center justify-between border-t border-slate-100 dark:border-slate-700">
      <button onclick="revealSafetyQuizAnswer()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        不會作答？查看解答
      </button>
      <div class="flex gap-2">
        <button id="safetyQuizSubmitBtn" onclick="submitSafetyQuizAnswer()" class="px-4 sm:px-5 py-2 rounded-xl bg-brand-600 text-white text-xs sm:text-sm font-medium hover:bg-brand-700 transition">
          核對答案
        </button>
        <button id="safetyQuizNextBtn" onclick="nextSafetyQuizQuestion()" class="hidden px-4 sm:px-5 py-2 rounded-xl bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 text-xs sm:text-sm font-medium hover:opacity-90 transition">
          下一題 ➔
        </button>
      </div>
    </div>
  `;
}

function submitSafetyQuizAnswer() {
  const { questions, currentIndex } = safetyQuizState;
  const current = questions[currentIndex];
  let allCorrect = true;

  current.answers.forEach((ans, idx) => {
    const input = document.getElementById(`safety-quiz-input-${currentIndex}-${idx}`);
    const userVal = input ? input.value.trim() : '';

    const isMatch = userVal && (ans.includes(userVal) || userVal.includes(ans) || ans.replace(/\s+/g,'') === userVal.replace(/\s+/g,''));
    if (input) {
      if (isMatch) {
        input.classList.remove('border-brand-400');
        input.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950');
      } else {
        input.classList.remove('border-brand-400');
        input.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950');
        allCorrect = false;
      }
      input.disabled = true;
    }
  });

  const fb = document.getElementById('safetyQuizFeedbackBox');
  fb.classList.remove('hidden');

  if (allCorrect) {
    safetyQuizState.score++;
    fb.className = "p-3 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300";
    fb.innerHTML = `🎉 完全正確！標準答案：【${current.answers.join('】、【')}】`;
  } else {
    fb.className = "p-3 rounded-xl text-xs sm:text-sm font-semibold bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300";
    fb.innerHTML = `⚠️ 有部分答案不符。標準解答為：<strong class="underline">【${current.answers.join('】、【')}】</strong><br><span class="text-xs font-normal">💡 解析備註：${current.keyNotes}</span>`;
  }

  document.getElementById('safetyQuizScoreText').innerText = `${safetyQuizState.score}`;
  document.getElementById('safetyQuizSubmitBtn').classList.add('hidden');
  document.getElementById('safetyQuizNextBtn').classList.remove('hidden');
}

function revealSafetyQuizAnswer() {
  const { questions, currentIndex } = safetyQuizState;
  const current = questions[currentIndex];
  current.answers.forEach((ans, idx) => {
    const input = document.getElementById(`safety-quiz-input-${currentIndex}-${idx}`);
    if (input) {
      input.value = ans;
      input.classList.add('border-amber-500');
    }
  });
  submitSafetyQuizAnswer();
}

function nextSafetyQuizQuestion() {
  safetyQuizState.currentIndex++;
  if (safetyQuizState.currentIndex >= safetyQuizState.questions.length) {
    finishSafetyQuiz();
  } else {
    renderActiveSafetyQuizQuestion();
  }
}

function finishSafetyQuiz() {
  document.getElementById('safetyQuizRunningPanel').classList.add('hidden');
  const resPanel = document.getElementById('safetyQuizResultPanel');
  resPanel.classList.remove('hidden');

  const total = safetyQuizState.questions.length;

  document.getElementById('safetyQuizScoreSummary').innerHTML = `
    您在本次測驗共 <span class="font-bold text-brand-600">${total}</span> 題中，答對了 <span class="font-bold text-emerald-600">${score}</span> 題。<br>
    正確率：<span class="text-3xl font-extrabold text-brand-600 my-2 inline-block">${rate}%</span>
  `;
}

function restartSafetyQuiz() {
  safetyQuizState.active = false;

// Safety Search
function executeSafetySearch(keyword) {
  keyword = keyword.trim().toLowerCase();
  const countEl = document.getElementById('safetySearchResultsCount');
  const listEl = document.getElementById('safetySearchResultsList');

  if (!keyword) {
    countEl.innerText = "請輸入關鍵字進行地安專屬檢索";
    listEl.innerHTML = "";
    return;
  }

  let matches = [];
  SAFETY_QUESTIONS.forEach(q => {
    if (q.text.toLowerCase().includes(keyword) || q.keyNotes.toLowerCase().includes(keyword)) {
      matches.push({ type: '填空題', id: q.id, title: `第 ${q.id} 題 [${q.category}]`, content: q.text });
    }
  });
  SAFETY_QA.forEach(qa => {
    if (qa.title.toLowerCase().includes(keyword) || qa.answer.toLowerCase().includes(keyword)) {
      matches.push({ type: '問答題', id: qa.id, title: `問答題第 ${qa.id} 題：${qa.title}`, content: qa.answer });
    }
  });
  SAFETY_SITUATIONS.forEach(sit => {
    if (sit.title.toLowerCase().includes(keyword) || sit.scenario.toLowerCase().includes(keyword) || sit.solution.toLowerCase().includes(keyword)) {
      matches.push({ type: '實境題', id: sit.id, title: `實境題 ${sit.id}：${sit.title}`, content: sit.scenario + "\n" + sit.solution });
    }
  });

  countEl.innerText = `搜尋「${keyword}」，找到 ${matches.length} 筆資料`;
  listEl.innerHTML = matches.map(m => `
    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
      <div class="flex items-center gap-2">
        <span class="text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300 font-bold">${m.type}</span>
        <h4 class="font-bold text-sm">${m.title}</h4>
      </div>
      <div class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">${m.content}</div>
    </div>
  `).join('');
}
</script>
</body>
</html>
